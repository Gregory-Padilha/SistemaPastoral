<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#556B2F"/>
      <stop offset="100%" stop-color="#263810"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5E9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border / Glass Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

  <!-- Main Church Building Graphic -->
  <g filter="url(#glow)">
    <!-- Church Base & Walls -->
    <path d="M19 32 L32 21 L45 32 V49 C45 50.1 44.1 51 43 51 H21 C19.9 51 19 50.1 19 49 Z" fill="url(#whiteGrad)"/>

    <!-- Left & Right Wing Transepts -->
    <path d="M14 38 L19 34 V49 C19 50.1 18.1 51 17 51 H16 C14.9 51 14 50.1 14 49 Z" fill="#E2E8D5"/>
    <path d="M50 38 L45 34 V49 C45 50.1 45.9 51 47 51 H48 C49.1 51 50 50.1 50 49 Z" fill="#E2E8D5"/>

    <!-- Arch Doorway -->
    <path d="M28 51 V41.5 C28 39.3 29.8 37.5 32 37.5 C34.2 37.5 36 39.3 36 41.5 V51 Z" fill="#263810"/>

    <!-- Rose Window -->
    <circle cx="32" cy="31" r="3.2" fill="url(#goldGrad)"/>
    <circle cx="32" cy="31" r="1.3" fill="#FFFFFF"/>

    <!-- Roofline Highlights -->
    <path d="M18 32.5 L32 20.5 L46 32.5" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cross on Top of Steeple -->
    <!-- Vertical Beam -->
    <rect x="30.2" y="8" width="3.6" height="13" rx="1.2" fill="url(#goldGrad)"/>
    <!-- Horizontal Beam -->
    <rect x="26" y="11.5" width="12" height="3.6" rx="1.2" fill="url(#goldGrad)"/>
  </g>

  <!-- Decorative Olive/Peace Base Accent -->
  <path d="M20 54.5 C26 53 38 53 44 54.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
</svg>
